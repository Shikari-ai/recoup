name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # The api extra too, or the 19 tests covering the webhook, HMAC
        # verification and the decision endpoint silently do not collect and CI
        # reports green over an untested integration surface. The llm extra
        # stays out on purpose: ClaudeProvider is tested against a fake client,
        # so installing the real SDK would add a dependency and prove nothing.
        run: pip install -e '.[dev,api]'

      # The core engine must work with nothing installed. If this breaks, the
      # "clone and run" promise in the README is no longer true.
      - name: Core engine runs on the standard library alone
        run: python -m recoup backtest --events 400 --quiet

      - name: Lint (real errors only)
        run: ruff check recoup/ tests/ scripts/

      - name: Tests
        run: pytest tests/ -q

      # Documentation drifts from the code silently: nothing errors when a
      # README quotes a figure from a configuration that no longer exists. This
      # re-derives every headline number from the committed artefacts in
      # results/ and fails if a document still cites the old one. It caught two
      # stale figures the first time it ran.
      - name: Documented figures match committed results
        run: python scripts/verify_numbers.py

      # Reproducibility is the basis of every number reported in the README,
      # and it broke once already (see docs/ENGINEERING_LOG.md §2). A set of
      # str-Enums iterating in hash-randomised order fed the outage RNG, so the
      # same seed produced a different world each run. This job re-runs the
      # pipeline under two different hash seeds and demands identical output.
      - name: Reproducible under differing PYTHONHASHSEED
        run: |
          PYTHONHASHSEED=0     python -m recoup backtest --events 800 --quiet > a.txt
          PYTHONHASHSEED=99991 python -m recoup backtest --events 800 --quiet > b.txt
          diff a.txt b.txt && echo "identical across hash seeds"
